<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>BBC 발행 예약 미리보기</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Malgun Gothic',sans-serif;background:#f4f6fa;color:#1D3A6B;padding:16px;max-width:640px;margin:0 auto}
h1{font-size:20px;font-weight:800;margin:8px 0 2px}
.sub{color:#8a94a6;font-size:13px;margin-bottom:16px}
.post{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(21,44,82,.06)}
.head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:15px}
.head .when{margin-left:auto;color:#8a94a6;font-size:13px;font-weight:600}
.ch{font-size:12px;font-weight:800;color:#fff;border-radius:999px;padding:3px 10px}
.ch.ig{background:#7C3AED}.ch.th{background:#1D3A6B}
.strip{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.strip img{width:180px;height:180px;object-fit:cover;border-radius:10px;flex:none}
pre{white-space:pre-wrap;word-break:keep-all;font-family:inherit;font-size:14px;line-height:1.6;color:#3d4a63;background:#f8f9fc;border-radius:10px;padding:12px}
.poll{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.poll div{border:2px solid #2EC4A5;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700;color:#1D3A6B;text-align:center}
.empty{color:#8a94a6;text-align:center;padding:40px 0}
.note{font-size:12px;color:#8a94a6;text-align:center;margin:20px 0}
</style></head><body>
<h1>발행 예약 미리보기</h1>
<div class="sub">갱신: 9/22(화) 06:00 · 수정할 부분이 있으면 업체명과 함께 말씀 주세요</div>
<div class="empty">예약된 발행 건이 없습니다</div>
<div class="note">BBC · Bucheon Business Club — 내부 검수용</div>
</body></html>
